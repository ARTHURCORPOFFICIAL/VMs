<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VMs - Browser Virtual Machines</title>
    <style>
        body { margin:0; padding:10px; background:#0a0a0a; color:#0f0; font-family:monospace; text-align:center; overflow-x:hidden; }
        h1 { margin:10px; font-size: 1.5rem; color:#0ff; }
        p { font-size: 0.9rem; }
        .controls { margin:10px; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
        button { padding:12px 20px; font-size:14px; background:#111; color:#0f0; border:1px solid #0f0; cursor:pointer; border-radius: 4px; flex: 1 1 auto; max-width: 200px; }
        button:active { background:#0f0; color:#000; }
        
        /* Mobile-Friendly Container [cite: 26] */
        #screen_container { border:2px solid #0f0; margin:10px auto; background:#000; width: 100%; max-width: 800px; aspect-ratio: 4/3; box-shadow:0 0 20px #0f0; position: relative; overflow: hidden; }
        #screen_container canvas { width: 100% !important; height: 100% !important; object-fit: contain; }
        
        #status { margin:10px; min-height:24px; color:#ff0; font-size:14px; }
        #progress { width:90%; height:12px; background:#222; margin:10px auto; border:1px solid #0f0; display:none; border-radius:6px; overflow:hidden; }
        #progress-bar { height:100%; width:0%; background:linear-gradient(to right, #0f0, #00ffff); transition:width 0.2s linear; }

        /* Log Overlay [cite: 27] */
        #log_container { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 100; text-align: left; padding: 20px; box-sizing: border-box; }
        #log_output { width: 100%; height: 90%; background: #000; color: #0f0; border: 1px solid #0f0; overflow-y: scroll; font-size: 12px; padding: 10px; white-space: pre-wrap; }
        .close-hint { color: #888; font-size: 11px; margin-top: 5px; text-align: center; }
    </style>
</head>
<body>
    <h1>🖥️ Mobile V86</h1>
    <p>Android 4.4 KitKat</p>
    
    <div class="controls">
        <button onclick="startAndroid44()">🚀 Start</button>
        <button onclick="stopVM()">⛔ Stop</button>
        <button onclick="toggleLogs()">📋 Logs</button>
        <button onclick="toggleFullscreen()">⛶ Full</button>
    </div>

    <div id="status">Ready</div>
    <div id="progress"><div id="progress-bar"></div></div>
    <div id="screen_container"></div>

    <div id="log_container" ondblclick="toggleLogs()">
        <h3 style="color:#0ff; margin-top:0;">System Logs</h3>
        <div id="log_output"></div>
        <div class="close-hint">Double-click anywhere here to exit logs</div>
    </div>

    <script src="https://copy.sh/v86/libv86.js"></script>
    <script>
        let emulator = null;
        const statusEl = document.getElementById('status');
        const progressEl = document.getElementById('progress');
        const progressBar = document.getElementById('progress-bar');
        const logOutput = document.getElementById('log_output');
        const logContainer = document.getElementById('log_container');

        function setStatus(msg, color = '#ff0') {
            statusEl.textContent = msg; [cite: 2]
            statusEl.style.color = color; [cite: 2]
        }

        function toggleLogs() {
            logContainer.style.display = logContainer.style.display === 'block' ? 'none' : 'block'; [cite: 36]
        }

        // Boot from local file in main branch [cite: 31, 34]
        function startAndroid44() {
            createEmulator("./android-x86-4.4-RC1.iso"); 
        }

        function createEmulator(cdromUrl) {
            if (emulator) emulator.destroy(); [cite: 5]
            
            const screen = document.getElementById('screen_container');
            setStatus("Fetching file data...", "#0ff");
            progressEl.style.display = 'block'; [cite: 6]
            progressBar.style.width = '0%';

            emulator = new V86Starter({
                wasm_path: "https://copy.sh/v86/v86.wasm", [cite: 7]
                screen_container: screen, [cite: 7]
                memory_size: 512 * 1024 * 1024, [cite: 7]
                vga_memory_size: 32 * 1024 * 1024, [cite: 7]
                autostart: true, [cite: 7]
                network_relay_server: "wss://relay.copy.sh/", [cite: 7]
                cdrom: { url: cdromUrl } [cite: 7]
            });

            // Realistic Progress Bar [cite: 30, 41]
            emulator.add_listener("serial0-output-char", (char) => {
                let current = parseInt(progressBar.style.width) || 0;
                if (current < 95) {
                    progressBar.style.width = (current + 1) + '%'; [cite: 42]
                }
                logOutput.textContent += char; [cite: 38]
                logOutput.scrollTop = logOutput.scrollHeight;
            });

            emulator.add_listener("emulator-ready", () => {
                progressBar.style.width = '100%'; [cite: 8, 42]
                setTimeout(() => {
                    progressEl.style.display = 'none'; [cite: 8]
                    setStatus("✅ Booted! Tap screen to focus.", "#0f0"); [cite: 8]
                }, 800);
            });
        }

        // Stop Button Logic [cite: 35]
        function stopVM() {
            if (emulator) {
                emulator.destroy(); [cite: 10]
                emulator = null; [cite: 11]
                progressEl.style.display = 'none'; [cite: 11]
                setStatus("VM stopped", "#f00"); [cite: 11]
            }
        }

        // Fullscreen Logic [cite: 37]
        function toggleFullscreen() {
            const el = document.getElementById('screen_container');
            if (!document.fullscreenElement) el.requestFullscreen(); [cite: 12]
            else document.exitFullscreen(); [cite: 12]
        }

        // Keyboard focus for mobile interactions [cite: 40]
        document.getElementById('screen_container').addEventListener('click', () => {
            if (emulator) emulator.keyboard_set_focus(true); [cite: 13]
        });
    </script>
</body>
</html>
