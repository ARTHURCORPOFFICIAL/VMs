<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VMs - Browser Virtual Machines</title>
    <style>
        body {
            margin: 0; padding: 0; background: #0a0a0a; color: #0f0; font-family: monospace;
            text-align: center; overflow: hidden;
        }
        h1 { margin: 15px; color: #0ff; }
        .controls { margin: 15px; }
        button, input {
            margin: 5px; padding: 10px 16px; font-size: 16px;
            background: #111; color: #0f0; border: 1px solid #0f0; cursor: pointer;
        }
        button:hover { background: #0f0; color: #000; }
        #screen_container {
            border: 3px solid #0f0; margin: 10px auto; background: #000;
            max-width: 100%; box-shadow: 0 0 30px #0f0;
        }
        #status { margin: 10px; min-height: 24px; color: #ff0; font-size: 15px; }
        #progress { width: 60%; height: 12px; background: #222; margin: 10px auto; border: 1px solid #0f0; display: none; }
        #progress-bar { height: 100%; width: 0%; background: linear-gradient(to right, #0f0, #0ff); transition: width 0.3s; }
    </style>
</head>
<body>
    <h1>🖥️ VMs in Browser</h1>
    <p>Android x86 Emulator (v86) • Old versions only • Desktop recommended</p>
    
    <div class="controls">
        <button onclick="startAndroid(1.6)">🚀 Android 1.6</button>
        <button onclick="startAndroid(4.4)">🚀 Android 4.4 KitKat</button>
        <br>
        <input type="file" id="isoInput" accept=".iso,.img">
        <button onclick="loadCustomISO()">📂 Custom ISO</button>
        <button onclick="stopVM()">⛔ Stop VM</button>
        <button onclick="toggleFullscreen()">⛶ Fullscreen</button>
        <button onclick="saveState()">💾 Save State</button>
        <button onclick="loadState()">📂 Load State</button>
    </div>

    <div id="status">Ready - Click a button to boot</div>
    <div id="progress"><div id="progress-bar"></div></div>
    <div id="screen_container"></div>

    <script src="https://copy.sh/v86/libv86.js"></script>
    <script>
        let emulator = null;
        const statusEl = document.getElementById('status');
        const progressEl = document.getElementById('progress');
        const progressBar = document.getElementById('progress-bar');

        function setStatus(msg, color = '#ff0') {
            statusEl.textContent = msg;
            statusEl.style.color = color;
        }

        function simulateLoading() {
            progressEl.style.display = 'block';
            let progress = 0;
            const interval = setInterval(() => {
                progress += Math.random() * 12;
                if (progress > 95) progress = 95;
                progressBar.style.width = progress + '%';
                if (progress > 90) {
                    clearInterval(interval);
                }
            }, 400);
            return interval;
        }

        function createEmulator(config) {
            if (emulator) emulator.destroy();
            
            const screen = document.getElementById('screen_container');
            setStatus("Booting Android... (1-5 minutes)", "#0ff");
            const loadingInterval = simulateLoading();
            
            emulator = new V86Starter({
                wasm_path: "https://copy.sh/v86/v86.wasm",
                screen_container: screen,
                memory_size: 512 * 1024 * 1024,
                vga_memory_size: 32 * 1024 * 1024,
                autostart: true,
                network_relay_server: "wss://relay.copy.sh/",
                ...config
            });

            emulator.add_listener("emulator-ready", () => {
                clearInterval(loadingInterval);
                progressEl.style.display = 'none';
                progressBar.style.width = '100%';
                setStatus("✅ Booted! Click inside screen for keyboard/mouse", "#0f0");
            });
        }

        function startAndroid(version) {
            setStatus(`Starting Android ${version}...`);
            if (version === 1.6) {
                createEmulator({ cdrom: { url: "https://copy.sh/v86/images/android.iso" } });
            } else if (version === 4.4) {
                createEmulator({ cdrom: { url: "https://copy.sh/v86/images/android4.iso" } });
            }
        }

        function loadCustomISO() {
            const file = document.getElementById('isoInput').files[0];
            if (!file) return alert("Select an ISO first!");
            const url = URL.createObjectURL(file);
            setStatus("Loading custom ISO...");
            createEmulator({ cdrom: { url: url } });
        }

        function stopVM() {
            if (emulator) {
                emulator.destroy();
                emulator = null;
                progressEl.style.display = 'none';
                setStatus("VM stopped", "#f00");
            }
        }

        function toggleFullscreen() {
            const screen = document.getElementById('screen_container');
            if (!document.fullscreenElement) {
                screen.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
        }

        // Basic save/load state (browser storage)
        function saveState() {
            if (!emulator) return alert("No running VM");
            emulator.save_state().then(state => {
                localStorage.setItem('androidVMState', JSON.stringify(Array.from(state)));
                setStatus("State saved to browser storage", "#0f0");
            });
        }

        function loadState() {
            const saved = localStorage.getItem('androidVMState');
            if (!saved || !emulator) return alert("No saved state or no VM running");
            const state = new Uint8Array(JSON.parse(saved));
            emulator.restore_state(state);
            setStatus("State restored", "#0f0");
        }

        // Focus controls
        document.getElementById('screen_container').addEventListener('click', () => {
            if (emulator) emulator.keyboard_set_focus(true);
        });

        document.addEventListener('keydown', e => {
            if (e.key === "Escape" && emulator) emulator.keyboard_set_focus(false);
        });
    </script>
</body>
</html>
